name: Daily Collection (Inbox + Candidates)

on:
  # 스케줄은 cron-job.org가 REST API로 건다 — 매일 01:30 KST.
  # GitHub 내장 schedule은 2026-08-02에 제거했다. 근거·설정은 MEMORY.md §9.
  #
  # inbox.yml + fetch-candidates.yml을 여기로 합쳤다(2026-08-02). 순서가 요점이다:
  # 인박스가 **먼저** 어제 글의 승인 판정을 처리해 PR을 닫고, 그 다음 오늘 후보를
  # 수집하고, 그 다음 05:00 루틴이 오늘 글을 만든다. 하루가 한 방향으로 흐른다.
  workflow_dispatch:

concurrency:
  group: daily-collect
  # inbox가 PR 병합·draft 플립을 한다 — 중간에 끊지 않는다.
  cancel-in-progress: false

jobs:
  inbox:
    name: 어제 글 승인 판정 처리
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Mask Sensitive Tokens
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Process Inbox Updates
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          PAT: ${{ secrets.PAT }}
          TELEGRAM_OFFSET: ${{ vars.TELEGRAM_OFFSET }}
          REPO: ${{ github.repository }}
        run: python scripts/process_inbox.py

  candidates:
    name: 오늘 후보 수집
    runs-on: ubuntu-latest
    needs: inbox
    # 순서만 강제하고 성공은 요구하지 않는다. 인박스는 텔레그램 API·저장소 변수
    # 쓰기·PR 병합에 걸려 있어 이 워크플로에서 가장 잘 깨지는 쪽인데, 그 실패가
    # 수집까지 막으면 오늘 /daily-post가 통째로 no_snapshot이 된다.
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mask Telegram token
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Fetch candidates
        id: fetch
        run: |
          mkdir -p snapshot_out
          RESULT=$(python scripts/fetch_candidates.py --out snapshot_out)
          echo "$RESULT"
          echo "total=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')" >> "$GITHUB_OUTPUT"
          echo "usable=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["usable"])')" >> "$GITHUB_OUTPUT"

      - name: Deliver to sidecar
        env:
          PAT: ${{ secrets.PAT }}
        run: bash scripts/sidecar_push.sh snapshot_out candidates

      - name: Alert on empty pool
        if: steps.fetch.outputs.total == '0'
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "fetch-candidates" "후보 0건 — 피드 전멸" \
            "한경 3피드와 폴백 4피드 모두에서 24시간 이내 기사를 얻지 못했다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Alert on zero usable bodies
        if: steps.fetch.outputs.total != '0' && steps.fetch.outputs.usable == '0'
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "fetch-candidates" "본문 확보 후보 0건" \
            "후보 ${{ steps.fetch.outputs.total }}건 중 body_ok 0건 — trafilatura 추출 열화 의심." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Alert on workflow failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "fetch-candidates" "워크플로 실패" \
            "수집이 완료되지 않았다. 오늘 무인 /daily-post는 산출물 없이 중단된다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
