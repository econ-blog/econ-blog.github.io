name: Weekly Housekeeping (무인 유지보수)

# 스케줄: GitHub 내장 `schedule`. 일 18:00 UTC = 월 03:00 KST.
#
# **§9의 cron-job.org 전환 결정에서 이 워크플로만 예외다.** 그 결정의 근거는 내장
# 스케줄이 3~4시간 늦게 발화한다는 실측이었고, 그것이 문제가 된 이유는 일간 체인의
# 여유가 3시간 13분뿐이었기 때문이다(수집 -> 05:00 발행). 유지보수에는 그런 예산이
# 없다 — 몇 시간 늦어도 아무것도 깨지지 않는다.
#
# 반대로 외부 스케줄러에 잡을 하나 더 만드는 비용은 실재한다. 2026-08-27까지 이
# 워크플로는 `workflow_dispatch`만 갖고 있었고 cron-job.org에도 잡이 없어서 **한 번도
# 스케줄로 돈 적이 없다.** 저장소 밖 설정은 조용히 빠져도 알 방법이 없다는 것이 바로
# 그 사례다. 여기 두면 저장소를 읽는 것만으로 보인다.
#
# 발화가 걸러지는 주가 있어도 격주 점검 §2가 `report/housekeeping-*.md`의 날짜 공백으로
# 집어낸다 — 이 워크플로는 스스로 알리지 않는 대신 감시받는다.
#
# 2026-08-27 무인 운영 전환: `content/` 수정을 `auto/audit-*` 브랜치로 빼서 PR·승인을
# 받던 경로를 없앴다. 이제 리포트·원장·본문 정정이 한 커밋으로 `main`에 직행한다.
#
# **텔레그램을 쓰지 않는다** — 성공도 실패도 알리지 않는다(사용자 지시). 이 패스는
# 순수 결정론이라 사람이 읽고 판단할 것이 없고, 실패는 격주 점검(`/health-check`)이
# `report/housekeeping-*.md`의 날짜 공백으로 집어낸다.
#
# 안전장치는 알림이 아니라 **단위 테스트**다. 테스트가 깨지면 커밋 스텝에 도달하지
# 못하므로, 고장난 헬퍼가 본문을 망가뜨린 채 `main`으로 나가는 경로가 없다.

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-housekeeping
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  housekeeping:
    name: 유지보수 실행 (무인)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      # 승인 게이트가 없어진 뒤로 이 스텝이 유일한 게이트다. 실패하면 여기서 멈춘다.
      - name: Run Unit Tests
        run: |
          for f in .claude/audit/lib/test_*.py; do python "$f" || exit 1; done
          for f in scripts/test_*.py; do python "$f" || exit 1; done

      - name: Run Housekeeping
        id: hk
        env:
          TZ: Asia/Seoul
        run: python scripts/housekeeping.py

      - name: Commit and Push
        run: |
          git config --global user.name "bjh7790"
          git config --global user.email "bjh7790@gmail.com"

          # 리포트·원장·본문 정정을 **한 커밋**으로 main에 올린다. 셋을 갈라 놓으면
          # "무엇을 보고 무엇을 고쳤나"가 커밋 경계에서 끊긴다.
          #
          # `content/`를 여기 함께 넣어도 `notify-post.yml`은 반응하지 않는다 —
          # 그쪽은 `post: ` 접두사만 본다(이 커밋은 `audit:`).
          git add -A report/ .claude/audit/link-state.json content/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "audit: 무인 유지보수 (${{ steps.hk.outputs.summary }})" \
                     -m "확정 사망 링크 제거 및 내부 링크 백필 정정"
          # 유지보수가 도는 사이 다른 커밋이 main에 들어왔을 수 있다(발행은 매일 돈다).
          git pull --rebase origin main
          git push origin main
