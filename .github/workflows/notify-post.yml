name: Telegram Post Notification

# 무인 발행 전환(2026-08-27) 이후 오늘의 글은 승인 없이 `main`으로 직행한다.
# 그 경로에는 PR이 없어 예전 `notify.yml`(pull_request: opened)이 반응할 대상이
# 사라졌다. 사용자는 승인 권한을 내려놓았지만 **매일 본문은 계속 받기로 했으므로**,
# 발행된 커밋을 보고 본문을 밀어 주는 경로가 따로 필요하다.
#
# 이 알림은 통보다 — 승인/반려를 묻지 않는다. 받는 쪽(`process_inbox.py`)이 없어졌고
# 사용자가 고치고 싶으면 로컬에서 `/revise-post`를 쓴다.

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**.md'

concurrency:
  group: notify-post-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    # `post: ` 로 시작하는 커밋만. 두 가지를 걸러 내기 위해서다:
    #   - `audit:` — 주간 유지보수가 백필·사망링크 정정으로 본문을 건드릴 때. 사람이
    #     읽고 할 일이 없는 기계적 수정이라 알리면 소음이다.
    #   - `post(revise): ` — 사람이 `/revise-post` 세션 안에서 직접 고쳐 민 것. 같은
    #     내용을 두 번 받게 된다.
    # 표현식을 큰따옴표로 감싼다 — 안의 `'post: '` 에 `: ` 가 들어 있어서, 따옴표 없이
    # 쓰면 YAML이 그 자리를 매핑 구분자로 읽고 워크플로 파일 전체가 파싱되지 않는다.
    if: "startsWith(github.event.head_commit.message, 'post: ')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HEAD~1과 비교해 이번 푸시가 건드린 글을 고른다.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Mask Sensitive Tokens
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Resolve published posts and commit body
        id: posts
        run: |
          # 무인 발행은 단일 커밋으로 민다 — HEAD~1..HEAD면 충분하다.
          # `--diff-filter=d` 로 삭제된 파일을 뺀다(읽을 수 없는 경로를 넘기면
          # 스크립트가 건너뛰긴 하지만, 애초에 넘기지 않는 편이 낫다).
          {
            echo 'files<<POST_FILES_EOF'
            git diff --name-only --diff-filter=d HEAD~1 HEAD -- 'content/posts/*.md' 2>/dev/null || true
            echo 'POST_FILES_EOF'
            echo 'body<<COMMIT_BODY_EOF'
            git log -1 --format=%b
            echo 'COMMIT_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send post to Telegram
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          POST_FILES: ${{ steps.posts.outputs.files }}
          COMMIT_BODY: ${{ steps.posts.outputs.body }}
        run: python scripts/telegram_notify.py post

      - name: Alert on failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "notify-post" "본문 전송 실패" \
            "글은 이미 발행되어 사이트에 올라가 있다. 전송만 실패했다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
