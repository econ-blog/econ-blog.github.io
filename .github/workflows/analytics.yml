name: Weekly Analytics Snapshot

on:
  # 스케줄은 cron-job.org가 REST API로 건다 — 매주 일 01:20 KST.
  # GitHub 내장 schedule은 2026-08-02에 제거했다. 근거·설정은 MEMORY.md §9.
  workflow_dispatch:

concurrency:
  group: analytics-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare credentials
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python3 -c "import os, json; creds=json.loads(os.environ['CREDENTIALS_JSON']); open(f\"{os.environ['RUNNER_TEMP']}/ga4_sa.json\", 'w').write(json.dumps(creds['ga4']['service_account']))"
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Fetch GA4 & GSC Snapshots
        env:
          GA4_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
          GSC_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
        run: |
          mkdir -p snapshot_output
          python scripts/fetch_ga4.py --days 28 --limit 200 > snapshot_output/ga4_28d.json
          python scripts/fetch_gsc.py --json --days 28 > snapshot_output/gsc_28d.json
          # ②가 요구하는 페이지 단위 집계. 기본 차원은 ["query","page"] 조합이라
          # total_rows 의미가 달라지고 주제군별 노출 합계가 틀어진다.
          python scripts/fetch_gsc.py --json --days 28 --dimensions page > snapshot_output/gsc_page_28d.json
          python scripts/fetch_gsc.py --json --sitemaps > snapshot_output/gsc_sitemaps.json
          
          INSPECT_URLS=$(python scripts/select_inspect_urls.py content/posts)
          if [ -n "$INSPECT_URLS" ]; then
            python scripts/fetch_gsc.py --json --inspect $INSPECT_URLS > snapshot_output/gsc_inspect.json
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4_sa.json"

      - name: Deliver to sidecar
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # 공개 저장소의 아티팩트는 누구나 다운로드할 수 있고, 루틴 샌드박스에는
          # gh 자격증명 경로가 없다 (AGENTS.md 자동화 평면).
          DAY=$(python3 -c "from datetime import datetime,timezone,timedelta; print(datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
          bash scripts/sidecar_push.sh snapshot_output "analytics/${DAY}"

      - name: Alert on workflow failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "analytics" "워크플로 실패" \
            "GA4/GSC 수집이 완료되지 않았다. 이번 주 감사 ②는 '조회 실패'로 저하된다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
