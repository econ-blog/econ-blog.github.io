name: Telegram PR Notification

on:
  pull_request:
    types: [opened]

concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: startsWith(github.head_ref, 'auto/post-') || startsWith(github.head_ref, 'auto/audit-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # 병합 커밋이 아니라 PR 브랜치의 실제 파일이 필요하다 — 초안을 첨부한다.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Mask Sensitive Tokens
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Collect draft post files
        id: draft_files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # PR이 건드린 content/posts/*.md 만. 삭제된 파일은 제외한다.
          {
            echo 'files<<PR_FILES_EOF'
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[] | select(.status != "removed") | select(.filename | startswith("content/posts/")) | select(.filename | endswith(".md")) | .filename'
            echo 'PR_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Notification
        id: send_notify
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_FILES: ${{ steps.draft_files.outputs.files }}
        run: python scripts/telegram_notify.py

      - name: Comment PR on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "⚠️ 텔레그램 알림 전송에 실패했습니다. 로그를 확인하세요."
