name: Fetch Link State

on:
  schedule:
    - cron: '37 16 * * 6' # UTC 토 16:37 = KST 일 01:37 (루틴 일 05:00 KST의 3시간 23분 전)
  workflow_dispatch:

concurrency:
  group: fetch-linkstate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mask Telegram token
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Collect inventory and check links
        env:
          # linkcheck.py 는 date.today() 로 원장에 날짜를 찍는다(수정 금지 파일).
          # 러너 기본 TZ가 UTC라 KST 01:37 실행이 전날로 기록된다 — TZ를 맞춰 준다.
          TZ: Asia/Seoul
        run: |
          mkdir -p linkstate_out
          python - <<'PY'
          import json, os, subprocess, sys, glob
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(timezone.utc)
          today = now.astimezone(KST).strftime("%Y-%m-%d")

          files = sorted(glob.glob("content/posts/*.md")) + sorted(glob.glob("content/dictionary/*.md"))
          inv = json.loads(subprocess.run(
              [sys.executable, ".claude/audit/lib/mdtext.py", *files],
              capture_output=True, text=True, check=True).stdout)

          # mdtext.inventory() 의 "external" 은 이미 source_url 과 related_urls 를
          # 포함한다 (.claude/audit/lib/mdtext.py 의 inventory 참조). 다시 더하지 않는다.
          urls = sorted({u for rec in inv.values() for u in rec.get("external") or [] if u})

          summary = json.loads(subprocess.run(
              [sys.executable, ".claude/audit/lib/linkcheck.py",
               ".claude/audit/link-state.json", *urls],
              capture_output=True, text=True, check=True).stdout)

          with open(".claude/audit/link-state.json", encoding="utf-8") as fh:
              ledger = json.load(fh)

          with open(f"linkstate_out/{today}.json", "w", encoding="utf-8") as fh:
              json.dump({"generated_at": now.astimezone(KST).isoformat(),
                         "inventory": inv, "summary": summary, "ledger": ledger},
                        fh, ensure_ascii=False, indent=2)
          print(json.dumps({"urls": len(urls)}, ensure_ascii=False))
          PY

      - name: Deliver to sidecar
        env:
          PAT: ${{ secrets.PAT }}
        run: bash scripts/sidecar_push.sh linkstate_out linkstate

      - name: Alert on failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "fetch-linkstate" "워크플로 실패" \
            "링크 조회가 완료되지 않았다. 이번 주 감사 ①은 '측정 안 함'으로 저하된다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
