name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2026-09-13 점검이 무인 경로의 실패 경보를 훑다가 찾은 구멍이다.
  # 판단 기준은 2026-08-30에 정한 그대로 — "이것이 실패하면 그 사실이 사람에게든
  # 다음 회차에게든 도달하는가".
  #
  # 여기서는 도달하지 않는다. 빌드나 배포가 죽으면 GitHub Pages는 **옛 버전을 계속
  # 서빙한다.** 그 사이 `notify-post.yml`은 이미 텔레그램으로 본문을 보냈으므로 사람은
  # 글이 올라간 줄 안다. 격주 점검도 저장소만 보므로 모른다. 저장소와 사이트가
  # 조용히 갈라지는 유일한 지점이고, 갈라진 채로 2주가 갈 수 있었다.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Mask Sensitive Tokens
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Alert on failure
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "hugo/deploy" "사이트 배포 실패" \
            "저장소에는 반영됐지만 사이트는 옛 버전을 계속 서빙한다. 오늘 발행된 글은 텔레그램으로 갔어도 웹에는 없다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
