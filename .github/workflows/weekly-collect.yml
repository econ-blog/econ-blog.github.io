name: Weekly Collection (Analytics + Link State)

on:
  # 스케줄은 cron-job.org가 REST API로 건다 — 매주 일 01:20 KST.
  # GitHub 내장 schedule은 2026-08-02에 제거했다. 근거·설정은 MEMORY.md §9.
  #
  # analytics.yml + fetch-linkstate.yml을 여기로 합쳤다(2026-08-02). 둘 다 같은
  # 일요일 감사 하나를 먹이므로 트리거가 갈릴 이유가 없다. 다만 **잡은 분리해
  # 병렬로** 둔다 — 스텝을 한 잡에 이어 붙이면 GA4 조회 실패가 링크 점검까지
  # 죽이고, 감사 ①이 근거 없이 '측정 안 함'으로 저하된다.
  workflow_dispatch:

concurrency:
  group: weekly-collect
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analytics:
    name: GA4 / GSC 스냅샷
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare credentials
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python3 -c "import os, json; creds=json.loads(os.environ['CREDENTIALS_JSON']); open(f\"{os.environ['RUNNER_TEMP']}/ga4_sa.json\", 'w').write(json.dumps(creds['ga4']['service_account']))"
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Fetch GA4 & GSC Snapshots
        env:
          GA4_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
          GSC_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga4_sa.json
        run: |
          mkdir -p snapshot_output
          python scripts/fetch_ga4.py --days 28 --limit 200 > snapshot_output/ga4_28d.json
          python scripts/fetch_gsc.py --json --days 28 > snapshot_output/gsc_28d.json
          # ②가 요구하는 페이지 단위 집계. 기본 차원은 ["query","page"] 조합이라
          # total_rows 의미가 달라지고 주제군별 노출 합계가 틀어진다.
          python scripts/fetch_gsc.py --json --days 28 --dimensions page > snapshot_output/gsc_page_28d.json
          python scripts/fetch_gsc.py --json --sitemaps > snapshot_output/gsc_sitemaps.json

          INSPECT_URLS=$(python scripts/select_inspect_urls.py content/posts)
          if [ -n "$INSPECT_URLS" ]; then
            python scripts/fetch_gsc.py --json --inspect $INSPECT_URLS > snapshot_output/gsc_inspect.json
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4_sa.json"

      - name: Deliver to sidecar
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # 공개 저장소의 아티팩트는 누구나 다운로드할 수 있고, 루틴 샌드박스에는
          # gh 자격증명 경로가 없다 (AGENTS.md 자동화 평면).
          DAY=$(python3 -c "from datetime import datetime,timezone,timedelta; print(datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
          bash scripts/sidecar_push.sh snapshot_output "analytics/${DAY}"

      - name: Alert on workflow failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "analytics" "워크플로 실패" \
            "GA4/GSC 수집이 완료되지 않았다. 이번 주 감사 ②는 '조회 실패'로 저하된다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  linkstate:
    name: 링크 상태 점검
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mask Telegram token
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Collect inventory and check links
        env:
          # linkcheck.py 는 date.today() 로 원장에 날짜를 찍는다(수정 금지 파일).
          # 러너 기본 TZ가 UTC라 KST 01:37 실행이 전날로 기록된다 — TZ를 맞춰 준다.
          TZ: Asia/Seoul
        run: |
          mkdir -p linkstate_out
          python - <<'PY'
          import json, os, subprocess, sys, glob
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(timezone.utc)
          today = now.astimezone(KST).strftime("%Y-%m-%d")

          def run(cmd):
              # capture_output=True 이면 CalledProcessError.__str__ 은 종료코드만 보여주고
              # stderr 는 삼켜진다 — Actions 로그와 텔레그램 알림 둘 다 진단 불가가 된다.
              # 실패 시 stderr/stdout 을 로그에 찍은 뒤 그대로 실패시킨다(삼키지 않는다).
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  print(f"::error::명령 실패: {' '.join(cmd)}", file=sys.stderr)
                  print(f"--- stderr ---\n{proc.stderr[-4000:]}", file=sys.stderr)
                  print(f"--- stdout (마지막 2000자) ---\n{proc.stdout[-2000:]}", file=sys.stderr)
                  raise subprocess.CalledProcessError(proc.returncode, cmd, proc.stdout, proc.stderr)
              return proc

          files = sorted(glob.glob("content/posts/*.md")) + sorted(glob.glob("content/dictionary/*.md"))
          inv = json.loads(run([sys.executable, ".claude/audit/lib/mdtext.py", *files]).stdout)

          # mdtext.inventory() 의 "external" 은 이미 source_url 과 related_urls 를
          # 포함한다 (.claude/audit/lib/mdtext.py 의 inventory 참조). 다시 더하지 않는다.
          urls = sorted({u for rec in inv.values() for u in rec.get("external") or [] if u})

          summary = json.loads(run([sys.executable, ".claude/audit/lib/linkcheck.py",
               ".claude/audit/link-state.json", *urls]).stdout)

          with open(".claude/audit/link-state.json", encoding="utf-8") as fh:
              ledger = json.load(fh)

          with open(f"linkstate_out/{today}.json", "w", encoding="utf-8") as fh:
              json.dump({"generated_at": now.astimezone(KST).isoformat(),
                         "inventory": inv, "summary": summary, "ledger": ledger},
                        fh, ensure_ascii=False, indent=2)
          print(json.dumps({"urls": len(urls)}, ensure_ascii=False))
          PY

      - name: Deliver to sidecar
        env:
          PAT: ${{ secrets.PAT }}
        run: bash scripts/sidecar_push.sh linkstate_out linkstate

      - name: Alert on failure
        if: failure()
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          python scripts/telegram_notify.py alert \
            "fetch-linkstate" "워크플로 실패" \
            "링크 조회가 완료되지 않았다. 이번 주 감사 ①은 '측정 안 함'으로 저하된다." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
