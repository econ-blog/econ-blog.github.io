name: Telegram Health Check Notification

# 격주 점검(`/health-check`)은 리포트를 `main`으로 직행시킨다. 리포트가 올라갔다는
# 사실만으로는 알리지 않는다 — 사용자가 정한 기준이 "꼭 필요한 경우에만"이고,
# 대부분의 회차는 점검이 스스로 고치고 끝나서 사람이 읽고 할 일이 없다.
#
# 보낼지 말지는 점검이 커밋 메시지 본문의 `알림:` 줄로 이미 판정해 놓는다. 그 판정을
# 여기서 다시 하지 않는다 — 두 곳이 각자 판단하면 언젠가 갈린다.
#
# 알리는 경우는 넷뿐이다(`.claude/commands/health-check.md` §0):
#   ① 월 1회 현황 리포트  ② 사람 승인이 필요한 변경
#   ③ 사람만 할 수 있는 작업(GSC 제출, 네이버 조회 등)  ④ 중대한 고장

on:
  push:
    branches: [main]
    paths:
      - 'report/health-*.md'

concurrency:
  group: notify-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    # 표현식을 큰따옴표로 감싼다 — 안의 `'알림: 필요'` 에 `: ` 가 들어 있어서, 따옴표
    # 없이 쓰면 YAML이 그 자리를 매핑 구분자로 읽고 파일 전체가 파싱되지 않는다.
    if: "contains(github.event.head_commit.message, '알림: 필요')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Mask Sensitive Tokens
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          BOT_TOKEN=$(python3 -c "import os, json; print(json.loads(os.environ['CREDENTIALS_JSON'])['telegram']['bot_token'])")
          echo "::add-mask::$BOT_TOKEN"

      - name: Resolve report and commit message
        id: report
        run: |
          REPORT=$(git diff --name-only HEAD~1 HEAD -- 'report/health-*.md' 2>/dev/null | tail -1 || true)
          # 얕은 클론이거나 첫 커밋이면 diff가 비어 있다. 디스크의 최신 리포트로 뒤를 받친다.
          if [ -z "$REPORT" ]; then
            REPORT=$(ls -1 report/health-*.md 2>/dev/null | sort | tail -1 || true)
          fi
          if [ -z "$REPORT" ]; then
            echo "리포트 파일을 찾지 못했다 — 알림을 보내지 않는다." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "url=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/$REPORT" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<COMMIT_BODY_EOF'
            git log -1 --format=%b
            echo 'COMMIT_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Notification
        if: steps.report.outputs.found == 'true'
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          COMMIT_BODY: ${{ steps.report.outputs.body }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
          REPORT_URL: ${{ steps.report.outputs.url }}
        run: python scripts/telegram_notify.py health
