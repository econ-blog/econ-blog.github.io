# 포스트 태그 통제 어휘 (controlled vocabulary)
#
# `content/posts/`의 tags는 반드시 이 목록에서만 고른다. 신규 태그를 즉석에서 만들지 않는다.
# 목적은 주제군(topic group) 형성이다 — 태그가 일회성이면 같은 태그를 가진 글이 영영 모이지
# 않아, 주간 감사(Agent3)의 성과 분석이 판정할 표본을 만들 수 없고 Hugo의 관련글 매칭도 안 붙는다.
#
# 목록에 없는 주제가 나오면: 목록 안에서 가장 가까운 상위 태그를 쓴다.
# 새 태그 추가는 사람이 판단해 이 파일에 직접 append한다 — 자동 추가 금지.
# `aliases`는 그 주제를 가리키는 다른 표현이며, 태그로 쓰지 않고 매칭 판단에만 쓴다.
#
# `content/dictionary/`는 이 목록의 적용 대상이 아니다 — 항상 tags: ["용어사전"] 하나뿐이다.
# `welcome.md` 같은 공지성 글은 tags: ["공지"]로 두고 이 목록을 적용하지 않는다.
#
# `focus: true`가 붙은 주제는 2026-09-06에 다시 정한 집중 축이다 —
# 청년주거·정책·금리·부동산. 2026-08-10의 축(금리·물가·부동산·반도체)을 대체한다.
#
# 바꾼 이유: 옛 축은 주제만 좁혔고 독자를 좁히지 않았다. 금리·부동산은 한국에서 가장
# 붐비는 주제군이라 그 자체로는 변별력이 없다. 반면 `writing-styles.md`는 처음부터
# 고교~대학생 눈높이를 요구하고 50대 가장 예시를 금지해 왔다 — 실제 차별점은 주제가
# 아니라 그 독자였고, 태그가 그것을 한 번도 반영하지 않았다.
#
# 그래서 축을 "주제 슬라이스"에서 "독자 슬라이스"로 옮긴다: 20대가 이번 달에 내려야
# 하는 돈 결정(주거·정책 마감)을 금리·부동산 뉴스로 설명한다. 기존 48건 중 38건이
# 금리·부동산이므로 코퍼스는 버려지지 않고 좁혀진다.
#
# 주제 권위는 같은 주제군에 글이 쌓여야 생기고, 감사 ②의 데이터 충분성 게이트(신호 충족
# 주제군 3개)도 그 방법으로만 열린다. 넓게 가면 어느 군도 표본이 차지 않는다.
#
# 표시의 효과는 두 곳뿐이다: `rank.md` §3의 집중 주제 가점(+1)과 `draft.md` §1의 태그 선택
# 우선순위. **어휘 목록 자체는 줄이지 않는다** — 지우면 그 주제 기사가 태그 없이 떠돌고
# `portfolio.py`의 D2 통제 어휘 소진 계산이 분모를 잃는다.

청년주거:
